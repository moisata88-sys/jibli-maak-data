# بيتشغّل لحاله مع كل «نشر الأسعار» من برنامج جيبلي معاك: بيفك الصور وبينشر data/ وimg/ على GitHub Pages.
name: publish
on:
  push:
    branches: [main]
    paths-ignore: ['track/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p site/img
          for z in imgzip/*.zip; do [ -f "$z" ] && unzip -qo "$z" -d site/img; done
          [ -d data ] && cp -r data site/
          [ -d m ] && cp -r m site/  # v0.17.13 موديل شيل الخلفية لشاشة المدير
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # v0.16.67: جيت هب أحياناً بيقول «No artifacts named github-pages» (خلل مؤقت عندهم) ← بنستنى وبنعيد مرتين
      - id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.d1.outcome == 'failure'
        run: sleep 30
      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 60
      - if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4